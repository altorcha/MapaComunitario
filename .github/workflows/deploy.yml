name: Desplegar a InfinityFree via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Sincronizar archivos con InfinityFree
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Subir cambios a InfinityFree vía FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Carpeta destino en InfinityFree (normalmente 'htdocs/' o 'tudominio.com/htdocs/')
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'htdocs/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/database.sql
            **/README.md
